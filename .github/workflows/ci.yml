name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + unit + e2e)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cts_app
          POSTGRES_PASSWORD: cts_app
          POSTGRES_DB: cts_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cts_app -d cts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - run: npm install --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test
      - name: e2e (against Postgres service)
        env:
          TEST_DATABASE_URL: postgres://cts_app:cts_app@127.0.0.1:5432/cts_test
          NODE_ENV: test
          JWT_SECRET: ci_jwt_secret_at_least_32_characters_long_xx
          BCRYPT_ROUNDS: '4'
        run: npm run test:e2e

  frontend:
    name: Frontend (lint + unit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - run: npm install --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test

  preflight:
    name: Preflight + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
