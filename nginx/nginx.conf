user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # File upload bound: 2 MB attachment + multipart overhead headroom.
    client_max_body_size 3m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain text/html image/svg+xml;
    gzip_min_length 1024;

    # Rate limit zone for /api/auth/login at the edge.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

    include /etc/nginx/conf.d/*.conf;
}
