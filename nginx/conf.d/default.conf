# Upstream pools — passive health-checks via max_fails / fail_timeout.
# When backend serves N replicas, list them here; round-robin is default.
upstream backend_upstream {
    server backend:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:80 max_fails=3 fail_timeout=10s;
    keepalive 8;
}

# HTTP → HTTPS redirect.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / { return 301 https://$host$request_uri; }
}

# HTTPS termination + reverse proxy.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (uncomment HSTS once a real cert is in place).
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Pass a request id through to backend.
    set $rid $http_x_request_id;
    if ($rid = '') { set $rid $request_id; }

    # ─── /api → backend ────────────────────────────────────────────────────
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $rid;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_pass http://backend_upstream/api/;
    }

    # Tighter rate limit on login at the edge.
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $rid;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://backend_upstream/api/auth/login;
    }

    # ─── /  → frontend SPA ────────────────────────────────────────────────
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frontend_upstream;
    }
}
